services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: telemetry
      POSTGRES_PASSWORD: telemetry
      POSTGRES_DB: telemetry
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U telemetry -d telemetry"]
      interval: 2s
      timeout: 3s
      retries: 10
      start_period: 2s

  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "127.0.0.1:4318:4318"
    environment:
      DATABASE_URL: postgres://telemetry:telemetry@postgres:5432/telemetry
      PORT: 4318
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
